<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Save to Yomu</title><link rel="stylesheet" href="popup.css"><script src="popup.js" defer></script></head><body><header><img class="icon" src="icons/icon128.png" alt=""><img class="wordmark" src="wordmark.png" alt="Yomu"></header><p class="muted">Save now. Read or listen later.</p><section><span id="domain"></span><h1 id="title">Current page</h1></section><label for="playlist">Save into</label><select id="playlist"><option value="">To read only</option></select><button id="save" class="primary" disabled>Save to Yomu</button><p id="status" role="status" aria-live="polite"></p><button id="open" class="link" disabled>Open your library</button><details id="settings"><summary>Settings</summary><label for="theme">Appearance</label><select id="theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select><p id="connection" class="muted">Not connected</p><form id="pair"><label for="server">Yomu website</label><input id="server" type="url" required spellcheck="false"><label for="token">Private access key</label><input id="token" type="password" autocomplete="off" spellcheck="false"><p class="muted small">Your key stays in this browser profile.</p><div class="buttons"><button id="connect">Connect</button><button id="disconnect" class="secondary" type="button" disabled>Disconnect</button></div></form></details><p class="muted small footer">Saves the page link and title. Your phone extracts the article on its next sync.</p></body></html>
