<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yomu · Your library</title><link rel="icon" type="image/png" href="/icon.png"><link rel="apple-touch-icon" href="/icon.png"><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><aside><div class="brand"><img class="brand-icon" src="/icon.png" alt=""><img class="wordmark" src="/wordmark.png" alt="Yomu"></div><p class="subtitle">Your reading, ready to listen.</p><nav id="navigation"></nav><button id="newPlaylist" class="quiet">+ New playlist</button><a class="roadmap-link" href="https://github.com/dave-patrick/yomu/blob/main/ROADMAP.md" target="_blank" rel="noopener noreferrer">Roadmap ↗</a><div class="connection"><span id="connection">Not connected</span><button id="pairButton" class="quiet">Connect devices</button><button id="disconnect" class="quiet">Disconnect browser</button></div></aside>
<main><header><div><h1 id="heading">To read</h1><p id="summary">Your articles and documents, together.</p></div><button id="refresh">Sync now</button></header>
<section class="save"><form id="saveLink"><label for="url">Save an article</label><div class="inputrow"><input id="url" type="url" placeholder="Paste an article link" required><button>Save to Yomu</button></div></form><label class="drop" id="drop">Drop documents here, or <span>browse files</span><input type="file" id="files" accept=".pdf,.docx,.txt" multiple><small>PDF, Word (.docx), or text · up to 20 MB each</small></label></section>
<div class="filter"><input id="search" type="search" placeholder="Search your library" aria-label="Search your library"><span id="count"></span></div><p id="notice" role="status"></p><section id="library" aria-label="Saved reading"></section></main>
<dialog id="pair"><form id="pairForm"><h2>Connect your library</h2><p>Use the same private access key on this browser, your phone, and the extension.</p><label>Access key<input id="key" type="password" autocomplete="off" required></label><p class="hint">The key is saved on this device. Only connect browsers you trust.</p><div class="inputrow"><button>Connect</button><button type="button" id="closePair" class="quiet">Cancel</button></div></form></dialog>
<dialog id="reader"><button id="closeReader" class="quiet">Close reader</button><h2 id="readerTitle"></h2><div id="readerText"></div></dialog>
</body></html>
